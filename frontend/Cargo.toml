[package]
name = "aios-frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.5", features = ["desktop", "hooks"] }
dioxus-desktop = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1.18"
tokio = { version = "1", features = ["time"] }